name: PAYGUARD CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test backend
        working-directory: backend
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Build dashboard
        working-directory: frontend
        run: npm install && npm run build

      - name: Build production dashboard image
        run: docker build --build-arg VITE_API_URL=http://localhost:8080 -t payguard-dashboard ./frontend

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: ml-service
        run: pip install -r requirements.txt

      - name: Run ML tests
        working-directory: ml-service
        run: pytest -q

      - name: Compile Python service
        working-directory: ml-service
        run: python -m compileall .

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          sed -i 's/replace-with-a-strong-database-password/ci-db-password/' .env
          sed -i 's/replace-with-a-long-random-secret-at-least-32-characters/ci-jwt-secret-at-least-32-characters-long-12345/' .env
          docker compose config
