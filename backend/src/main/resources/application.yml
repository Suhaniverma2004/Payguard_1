spring:
  application:
    name: payguard-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payguard}
    username: ${DB_USER:payguard}
    password: ${DB_PASSWORD:payguard}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payguard-risk-engine
      auto-offset-reset: earliest
      enable-auto-commit: true
    producer:
      properties:
        spring.json.add.type.headers: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
server:
  port: 8080
security:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value-please}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
